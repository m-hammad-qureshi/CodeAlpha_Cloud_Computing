<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .register-card { background: #1e293b; border: 1px solid #334155; width: 100%; max-width: 450px; border-radius: 12px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 26px; color: #38bdf8; font-weight: 600; }
        .header p { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        
        /* Form Field Layout */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { color: #94a3b8; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .form-group input { background: #0f172a; border: 1px solid #334155; padding: 11px; border-radius: 6px; color: #f1f5f9; font-size: 15px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #38bdf8; }
        
        /* Unified Submit Button */
        .submit-btn { display: block; width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px; margin-bottom: 20px; }
        .submit-btn:hover { background: #0ea5e9; }
        
        /* Links */
        .footer-link { display: block; text-align: center; color: #94a3b8; font-size: 14px; text-decoration: none; transition: color 0.2s; }
        .footer-link:hover { color: #38bdf8; }

        /* Robust Flash Message Alerts */
        .flash-message { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="header">
            <h1>Create Account</h1>
            <p>Cryptographic & Parameterized Registration</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-message">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Create your username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required placeholder="Enter your mobile number">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
            </div>

            <input type="submit" class="submit-btn" value="Register System Account">
            
            <a href="/login" class="footer-link">Already have an account? Login here.</a>
        </form>
    </div>    

</body>
</html>
